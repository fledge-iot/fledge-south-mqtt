name: Build plugin .deb

on:
  pull_request:
  push:
    branches: [develop]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deb:
    uses: fledge-iot/fledge/.github/workflows/plugin-deb.yml@develop
    with:
      package: fledge-south-mqtt-readings
      kind: python
    secrets: inherit
